[project]
name = "pfe-job-copilot"
version = "0.1.0"
description = "Local job collection pipeline for PFE internships in France."
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.12.3",
    "fastapi>=0.116.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.1",
    "typer>=0.12.3",
    "uvicorn[standard]>=0.35.0",
]

[project.optional-dependencies]
discovery = ["python-jobspy>=1.1.80"]
dev = ["pytest>=8.3.0"]

[project.scripts]
pfe = "pfe_job_copilot.cli:app"
pfe-api = "pfe_job_copilot.api:run"

[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
